<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>천안맛ZIP 관리자 페이지</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #333;
        }

        .hero {
            width: 100%;
            height: 420px;
            background-image: url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1600");
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.35) 0%,
                    rgba(255, 255, 255, 0.35) 45%,
                    rgba(255, 255, 255, 1.9) 100%
            );
        }

        .hero-overlay {
            position: relative;
            z-index: 1;
            height: 100%;
            padding-top: 145px;
            text-align: center;
            color: white;
            box-sizing: border-box;
        }

        .hero-overlay h1 {
            font-size: 46px;
            font-weight: 900;
            margin-bottom: 18px;
            color: white;
            text-shadow:
            0 2px 4px rgba(0, 0, 0, 0.5),
            0 6px 18px rgba(0, 0, 0, 0.45);
        }

        .hero-overlay p {
            font-size: 18px;
            margin-bottom: 36px;
            font-weight:600;
            text-shadow:
            0 2px 4px rgba(0, 0, 0, 0.5),
            0 6px 18px rgba(0, 0, 0, 0.45);
        }

        .admin-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
        }

        .admin-card {
            width: 260px;
            min-height: 170px;
            padding: 28px 30px;
            border: 1px solid #e1e8f3;
            background-color: white;
            cursor: pointer;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-weight: 700;
            text-decoration: none;
            color: #333;
            box-sizing: border-box;
        }

        .admin-card strong {
            font-size: 20px;
            font-weight: 900;
        }

        .admin-card span {
            font-size: 15px;
            color: #5b6475;
            line-height: 1.7;
            font-weight: 500;
        }

        .user-page-container {
    width: 860px;
    margin: 28px auto 0;
}

.user-page-card {
    width: 100%;
    min-height: 105px;
    padding: 24px 30px;
    border: 1px solid #e1e8f3;
    background-color: white;
    cursor: pointer;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    color: #333;
    box-sizing: border-box;
}

.user-page-card strong {
    font-size: 20px;
    font-weight: 900;
}

.user-page-card span {
    font-size: 15px;
            color: #5b6475;
            line-height: 1.7;
            font-weight: 500;
}

        .section-title {
            display: flex;
            flex-direction: column;
            padding: 0 45px;
            gap: 10px;
            margin-top: 70px;
            text-align: center;
        }

        .section-title p {
            font-size: 26px;
            font-weight: 900;
            color: #333;
            margin: 0;
        }

        .section-title span {
            font-size: 15px;
            color: #5b6475;
            line-height: 1.7;
            font-weight: 500;
        }

        .primary-button {
            width: 160px;
            height: 48px;
            border: none;
            border-radius: 30px;
            background-color: #ff6b3d;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin: 20px auto 0;
            display: block;
        }
    </style>
</head>
<body>

<section class="hero">
    <div class="hero-overlay">
        <h1>천안맛ZIP 관리자</h1>

    </div>
</section>

<section class="section-title">

    <span>맛집 정보 등록과 목록 관리를 진행할 수 있습니다.</span>
</section>

<section class="admin-container">
    <a class="admin-card" href="/admin/restaurants/new">
        <strong>맛집 등록</strong>
        <span>식당 이름, 주소, 카테고리, 대표 이미지, 인기 메뉴를 등록합니다.</span>
    </a>

    <a class="admin-card" href="/admin/restaurants">
        <strong>맛집 목록 관리</strong>

    </a>
</section>

<section class="user-page-container">
    <a class="user-page-card" href="http://localhost:3000">
        <strong>사용자 페이지로 이동</strong>
        <span>메인 페이지로 돌아가 실제 사용자 화면을 확인합니다.</span>
    </a>
</section>

</body>
</html>
